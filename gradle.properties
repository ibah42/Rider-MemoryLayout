# The IDE this plugin is built against.
#   RD = Rider, IC = IntelliJ IDEA Community (a much smaller download - every API in use is a
#   platform API present in both, so debugging the UI is more convenient on IC).
platformType=RD
platformVersion=2026.2.2

# Lower compatibility bound. 252 = 2025.2. Tool window and table APIs have been stable for years.
pluginSinceBuild=252

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true

# The IntelliJ Platform Gradle Plugin does not always get along with the configuration cache
# (runIde in particular). Turn it on only deliberately.
org.gradle.configuration-cache=false

# The stdlib comes from the IDE itself; bundling our own would clash on versions.
kotlin.stdlib.default.dependency=false
